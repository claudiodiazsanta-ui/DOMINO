<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>FamiDominó</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f3d2e;color:#f4f1e6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#ffd54a;color:#2b2200;font-weight:700;cursor:pointer}
button.alt{background:#1f6b50;color:#f4f1e6}
button.dark{background:#0b2a20;color:#f4f1e6;border:1px solid #2c7a5c}
button.red{background:#c0392b;color:#fff}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;padding:12px;border-radius:10px;border:2px solid #2c7a5c;background:#0b2a20;color:#f4f1e6;width:100%}
h1{margin:.2em 0;font-size:2rem}
.home{padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.hint{opacity:.7;font-size:.85rem;margin:0}
.code{font-size:2.6rem;letter-spacing:.25em;font-weight:900;text-align:center;background:#0b2a20;border-radius:14px;padding:8px}
.card{background:#145239;border-radius:16px;padding:14px}
.lobby{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;background:#0b2a20;padding:8px 12px;border-radius:10px}
.pitem span{flex:1}
.pitem button{padding:4px 10px}
.legend{--f:52px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.legend div{text-align:center;font-size:.75rem;width:72px;display:flex;flex-direction:column;align-items:center}
/* faces and tiles */
.face{width:var(--f);height:var(--f);position:relative;flex:none}
.face .ph{position:absolute;left:0;top:0;width:80%;height:80%;border-radius:50%;background:var(--c);border:2px solid #fff9;overflow:hidden;display:grid;place-items:center}
.face img{width:100%;height:100%;object-fit:cover}
.face .ph i{font-style:normal;font-size:calc(var(--f)*.5)}
.face b{position:absolute;right:0;bottom:0;background:#fff;color:#111;border:2px solid #111;border-radius:50%;font-size:max(12px,calc(var(--f)*.34));width:1.5em;height:1.5em;display:grid;place-items:center;line-height:1;font-weight:900;box-shadow:0 1px 3px #0008;box-sizing:border-box}
.face .pp{position:absolute;right:0;bottom:0;width:52%;height:52%;background:#fffdf5;border:2px solid #222;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8%;box-sizing:border-box;box-shadow:0 1px 3px #0009}
.face .pp u{text-decoration:none;border-radius:50%;margin:6%}
.face .pp u.o{background:#111}
.tile{display:inline-flex;background:#f6efdc;border-radius:9px;border:2px solid #3a2f1b;box-shadow:0 2px 4px #0006;align-items:center;justify-content:center;flex:none;color:#000}
.tile.v{flex-direction:column}.tile.h{flex-direction:row}
.tile .half{padding:4px;display:grid;place-items:center}
.tile.h .half+.half{border-left:2px solid #3a2f1b}
.tile.v .half+.half{border-top:2px solid #3a2f1b}
.hand .tile{--f:52px}.mini .tile{--f:20px}
.mini .tile .half{padding:2px}
.tile.ok{outline:3px solid #ffd54a;transform:translateY(-8px)}
.tile.no{opacity:.45}
.tile.selected{outline-color:#fff}
/* game */
.top{display:flex;gap:6px;padding:8px;align-items:center}
.top .ttl{flex:1;font-weight:700}
.top button{padding:6px 10px}
.players{display:flex;gap:6px;padding:0 8px 6px;overflow-x:auto}
.pl{background:#0b2a20;border-radius:10px;padding:6px 10px;min-width:92px;border:2px solid transparent;flex:none}
.pl.on{border-color:#ffd54a;box-shadow:0 0 10px #ffd54a88}
.pl.out{opacity:.4;text-decoration:line-through}
.pl .nm{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pl .st{font-size:.75rem;opacity:.95;margin-top:2px}
.pl{min-width:104px}.pl.warn{border-color:#e67e22}.pl.danger{border-color:#e74c3c}
.pip{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #7fd6ae;margin-right:3px;vertical-align:middle}
.pip.x{background:#e74c3c;border-color:#e74c3c}
.lgbar{display:flex;gap:10px;overflow-x:auto;padding:4px 10px 8px;--f:36px;align-items:center}
.lgi{display:flex;gap:6px;align-items:center;flex:none;font-size:.78rem;background:#0b2a20;border-radius:20px;padding:3px 10px 3px 4px}
.lgi b{font-size:.95rem}
.bwrap{flex:1;position:relative;min-height:0;background:radial-gradient(#1a6b4c,#0f3d2e)}
.board{position:absolute;inset:0;overflow:auto}
.boardin{position:relative;margin:auto}
.btile{position:absolute;display:flex;background:#f6efdc;border-radius:7px;box-shadow:inset 0 0 0 2px #3a2f1b,0 2px 3px #0006;overflow:hidden}
.btile.vert{flex-direction:column}
.bh{flex:1;display:grid;place-items:center;box-sizing:border-box}
.btile:not(.vert) .bh+.bh{border-left:2px solid #3a2f1b}
.btile.vert .bh+.bh{border-top:2px solid #3a2f1b}
.bh.end .face .ph{box-shadow:0 0 0 3px #ffd54a,0 0 12px 4px #ffd54a}
.zoom{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:3}
.zoom button{padding:4px 10px;font-size:1rem;opacity:.85}
.ends{text-align:center;font-size:.8rem;padding:4px;display:flex;gap:10px;justify-content:center;align-items:center;--f:24px}
.status{padding:6px 10px;display:flex;gap:10px;align-items:center}
.status .msg{flex:1;font-weight:700}
.tbar{height:6px;background:#0b2a20;margin:0 10px;border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;background:#ffd54a;width:100%}
.acts{display:flex;gap:8px;padding:8px 10px}
.acts button{flex:1}
.status.mine{background:#ffd54a;color:#2b2200;border-radius:12px;margin:2px 10px;padding:8px 12px;animation:glow 1s infinite}
.status.mine .msg{font-size:1.25rem;font-weight:900}
@keyframes glow{50%{box-shadow:0 0 18px 4px #ffd54a}}
#app.myturn{box-shadow:inset 0 0 0 4px #ffd54a}
#app.myturn .hand{background:#1d5c3f}
.tbar i.urgent{background:#e74c3c}
#tnum.urgent{color:#ff4d3d;animation:p .5s infinite;font-size:1.3rem}
.status.mine #tnum.urgent{color:#c40000}
.lastlog{font-size:.75rem;opacity:.8;padding:2px 10px;height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pulse{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.05)}}
.hand{display:flex;gap:10px;overflow-x:auto;padding:18px 10px 12px;min-height:146px;align-items:flex-end;background:#0b2a20}
.hand .empty{opacity:.6;margin:auto}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.ov .card{max-width:520px;width:100%;max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.cover{position:fixed;inset:0;background:#0f3d2e;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;text-align:center;gap:12px;padding:20px}
.res{display:flex;flex-direction:column;gap:6px}
.res .r{background:#0b2a20;border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res .r.lose{border:2px solid #e74c3c}.res .r.win{border:2px solid #ffd54a}
.res .mini{display:flex;gap:3px;flex-wrap:wrap}
.fam{--f:48px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;background:#0b2a20;padding:8px;border-radius:10px}
.fam .f2{display:flex;gap:6px;flex-wrap:wrap}
.fam input[type=text]{padding:8px}.fam input[type=color]{width:44px;padding:2px;height:38px}
.fam label.btn{background:#1f6b50;border-radius:10px;padding:8px 10px;font-weight:700;font-size:.85rem;cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:20px;z-index:50;max-width:90%;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:4px;text-align:left;border-bottom:1px solid #2c7a5c}
.big{font-size:3rem;text-align:center}
</style>

<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>

<script id="engine">
/* ============ MOTOR (reglas puras del dominó doble-6) ============ */
const Engine=(function(){
  const HAND={2:7,3:7,4:7,5:5,6:4,7:3,8:3};      // fichas por jugador según nº de jugadores activos
  const tsum=t=>t[0]+t[1];
  const hsum=h=>h.reduce((s,t)=>s+tsum(t),0);
  function allTiles(){const t=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)t.push([a,b]);return t;}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function active(g){return g.players.filter(p=>!p.out);}
  function pname(g,id){const p=g.players.find(p=>p.id===id);return p?p.name:'?';}
  function log(g,m){g.log.push(m);if(g.log.length>40)g.log.shift();}
  function defaultFamily(){
    const d=[['Lia','🐶','#c8a27a'],['Claudia','👩','#e84393'],['Javi','👨','#3498db'],['Abraham','🧔','#27ae60'],
             ['Vanessa','👩','#9b59b6'],['Mamá Pepi','👩','#e67e22'],['Papá Javi','👨','#16a085']];
    return d.map(x=>({name:x[0],emoji:x[1],color:x[2],photo:''}));
  }
  function newGame(settings,family){
    return {phase:'lobby',round:0,settings:Object.assign({maxLosses:3,turnSecs:30,doubleDouble:true},settings||{}),family:family||defaultFamily(),
      players:[],board:[],leftCount:0,hands:{},boneyard:[],turn:null,turnNo:0,passes:0,forced:null,lastWinner:null,log:[],result:null,
      champion:null,deadline:0,botAt:0,nextAt:0,famV:1};
  }
  function addPlayer(g,name,opts){
    if(g.players.length>=8)return null;
    const id=g.players.length?Math.max(...g.players.map(p=>p.id))+1:0;
    const p=Object.assign({id,name:name||'Jugador',losses:0,out:false,bot:false,afk:0,clientId:null,connected:true},opts||{});
    g.players.push(p);return p;
  }
  function removePlayer(g,id){g.players=g.players.filter(p=>p.id!==id);}
  function legal(board,hand,forced){
    const res=[];
    if(!board.length){hand.forEach((t,i)=>{if(!forced||(t[0]===forced[0]&&t[1]===forced[1]))res.push({i,side:'R'});});return res;}
    const l=board[0][0],r=board[board.length-1][1];
    hand.forEach((t,i)=>{
      const hasL=t[0]===l||t[1]===l,hasR=t[0]===r||t[1]===r;
      if(hasR)res.push({i,side:'R'});
      if(hasL&&!(hasR&&l===r))res.push({i,side:'L'});
    });
    return res;
  }
  // Regla opcional ("tapicui"): con dos dobles que coinciden con los dos extremos distintos de la mesa, se ponen las dos en el mismo turno
  function canDouble2(settings,board,hand){
    if(!settings||!settings.doubleDouble||!board.length||!hand)return null;
    const l=board[0][0],r=board[board.length-1][1];if(l===r)return null;
    const il=hand.findIndex(t=>t[0]===l&&t[1]===l),ir=hand.findIndex(t=>t[0]===r&&t[1]===r);
    return(il>=0&&ir>=0)?{l,r,il,ir}:null;
  }
  function setTurn(g,pid){g.turn=pid;g.turnNo++;g.deadline=Date.now()+g.settings.turnSecs*1000;const bp=g.players.find(x=>x.id===pid);g.botAt=Date.now()+(bp&&bp.bot?4500+Math.random()*1500:1200);}
  function nextPid(g,pid){
    const act=active(g);const i=act.findIndex(p=>p.id===pid);
    return act[(i+1)%act.length].id;
  }
  function startRound(g){
    g.round++;g.board=[];g.leftCount=0;g.passes=0;g.result=null;g.phase='playing';
    const act=active(g),n=act.length,hs=HAND[n]||3;
    const deck=shuffle(allTiles());g.hands={};
    act.forEach(p=>{g.hands[p.id]=deck.splice(0,hs);});
    g.boneyard=deck;
    let starter,forced=null;
    if(g.lastWinner==null||!act.find(p=>p.id===g.lastWinner)){
      let best=-1;
      act.forEach(p=>g.hands[p.id].forEach(t=>{
        const k=t[0]===t[1]?1000+t[0]:tsum(t)*10+Math.max(t[0],t[1]);
        if(k>best){best=k;starter=p.id;forced=t;}
      }));
      g.forced=forced;
      log(g,'Ronda '+g.round+': empieza '+pname(g,starter)+' con la ficha más alta');
    }else{starter=g.lastWinner;g.forced=null;log(g,'Ronda '+g.round+': empieza '+pname(g,starter)+' (ganó la anterior)');}
    setTurn(g,starter);
  }
  function endRound(g,winnerHint,kind){
    const act=active(g);const sums={},counts={},hands={};
    act.forEach(p=>{sums[p.id]=hsum(g.hands[p.id]);counts[p.id]=g.hands[p.id].length;hands[p.id]=g.hands[p.id].map(t=>t.slice());});
    let winner=winnerHint;
    if(winner==null){ // bloqueo: gana quien menos suma
      winner=act.slice().sort((a,b)=>sums[a.id]-sums[b.id]||counts[a.id]-counts[b.id])[0].id;
    }
    const others=act.filter(p=>p.id!==winner);
    const loser=others.slice().sort((a,b)=>sums[b.id]-sums[a.id]||counts[b.id]-counts[a.id])[0].id;
    const lp=g.players.find(p=>p.id===loser);lp.losses++;
    let eliminated=false;
    if(lp.losses>=g.settings.maxLosses){lp.out=true;eliminated=true;}
    g.lastWinner=winner;
    g.result={kind,winner,loser,sums,hands,eliminated};
    log(g,pname(g,winner)+' gana la ronda; '+pname(g,loser)+' suma '+sums[loser]+' y recibe un punto negativo');
    g.turn=null;
    if(active(g).length<=1){g.phase='gameEnd';g.champion=active(g)[0].id;g.nextAt=0;log(g,'¡'+pname(g,g.champion)+' gana la partida!');}
    else{g.phase='roundEnd';g.nextAt=Date.now()+12000;}
  }
  function act(g,pid,a,i,side,manual){
    if(g.phase!=='playing')return{err:'No se está jugando'};
    if(g.turn!==pid)return{err:'No es tu turno'};
    const hand=g.hands[pid];const moves=legal(g.board,hand,g.forced);
    const p=g.players.find(p=>p.id===pid);
    if(manual)p.afk=0;
    if(a==='play'){
      const m=moves.find(m=>m.i===i&&m.side===side);
      if(!m)return{err:'Jugada no válida'};
      const t=hand.splice(i,1)[0];let o;
      if(!g.board.length){o=t.slice();g.board.push(o);}
      else if(side==='R'){const r=g.board[g.board.length-1][1];o=t[0]===r?[t[0],t[1]]:[t[1],t[0]];g.board.push(o);}
      else{const l=g.board[0][0];o=t[1]===l?[t[0],t[1]]:[t[1],t[0]];g.board.unshift(o);g.leftCount++;}
      g.forced=null;g.passes=0;
      log(g,pname(g,pid)+' pone '+t[0]+'|'+t[1]);
      if(!hand.length){endRound(g,pid,'domino');return{ok:1};}
      setTurn(g,nextPid(g,pid));return{ok:1};
    }
    if(a==='play2'){
      const d=canDouble2(g.settings,g.board,hand);
      if(!d)return{err:'No puedes poner dos dobles a la vez'};
      const hi=Math.max(d.il,d.ir),lo=Math.min(d.il,d.ir);
      hand.splice(hi,1);hand.splice(lo,1);
      g.board.unshift([d.l,d.l]);g.leftCount++;g.board.push([d.r,d.r]);
      g.forced=null;g.passes=0;
      log(g,pname(g,pid)+' pone dos dobles a la vez: '+d.l+'|'+d.l+' y '+d.r+'|'+d.r);
      if(!hand.length){endRound(g,pid,'domino');return{ok:1};}
      setTurn(g,nextPid(g,pid));return{ok:1};
    }
    if(a==='draw'){
      if(moves.length)return{err:'Tienes ficha para jugar'};
      if(!g.boneyard.length)return{err:'No quedan fichas en el pozo'};
      hand.push(g.boneyard.pop());g.deadline=Date.now()+g.settings.turnSecs*1000;g.botAt=Date.now()+(p.bot?2500:700);
      log(g,pname(g,pid)+' roba');return{ok:1};
    }
    if(a==='pass'){
      if(moves.length)return{err:'Tienes ficha para jugar'};
      if(g.boneyard.length)return{err:'Debes robar'};
      g.passes++;log(g,pname(g,pid)+' pasa');
      if(g.passes>=active(g).length){endRound(g,null,'bloqueo');return{ok:1};}
      setTurn(g,nextPid(g,pid));return{ok:1};
    }
    return{err:'Acción desconocida'};
  }
  function botMove(g,pid){
    const hand=g.hands[pid];const moves=legal(g.board,hand,g.forced);
    if(canDouble2(g.settings,g.board,hand))return act(g,pid,'play2',0,0,false);
    if(moves.length){
      moves.sort((a,b)=>tsum(hand[b.i])-tsum(hand[a.i]));
      const top=moves.filter(m=>tsum(hand[m.i])===tsum(hand[moves[0].i]));
      const m=top[Math.floor(Math.random()*top.length)];
      return act(g,pid,'play',m.i,m.side,false);
    }
    if(g.boneyard.length)return act(g,pid,'draw',0,0,false);
    return act(g,pid,'pass',0,0,false);
  }
  function timeout(g){
    const pid=g.turn,p=g.players.find(p=>p.id===pid);
    if(!p)return;
    const hand=g.hands[pid],moves=legal(g.board,hand,g.forced);
    if(moves.length){           // tenía ficha y no la puso: pierde el turno
      p.afk++;log(g,p.name+' no jugó a tiempo: pierde el turno');g.passes=0;setTurn(g,nextPid(g,pid));return;
    }
    if(g.boneyard.length){      // sin ficha: se le roba una; sigue robando hasta que pueda jugar o se acabe el pozo
      hand.push(g.boneyard.pop());log(g,p.name+' no actuó: se le roba una ficha');
      const can=legal(g.board,hand,g.forced).length>0;
      g.deadline=Date.now()+(can?g.settings.turnSecs*1000:2000);
      g.botAt=Date.now()+2000;return;
    }
    p.afk++;return act(g,pid,'pass',0,0,false);   // pozo vacío y sin ficha: salta el turno
  }
  function nextRound(g){if(g.phase==='roundEnd')startRound(g);}
  function backToLobby(g){
    g.phase='lobby';g.round=0;g.lastWinner=null;g.result=null;g.champion=null;g.board=[];g.hands={};g.boneyard=[];g.turn=null;g.log=[];g.statsDone=false;
    g.players=g.players.filter(p=>p.connected||p.bot||true);
    g.players.forEach(p=>{p.losses=0;p.out=false;p.afk=0;});
  }
  function view(g,pid){
    return {phase:g.phase,round:g.round,settings:g.settings,
      players:g.players.map(p=>({id:p.id,name:p.name,losses:p.losses,out:p.out,bot:p.bot,connected:p.connected,afk:p.afk>=2,count:(g.hands[p.id]||[]).length})),
      board:g.board,leftCount:g.leftCount,boneyard:g.boneyard.length,turn:g.turn,passes:g.passes,forced:g.board.length?null:g.forced,
      me:pid,hand:(pid!=null&&g.hands[pid])?g.hands[pid]:null,log:g.log.slice(-8),champion:g.champion,famV:g.famV,
      timeLeft:Math.max(0,(g.deadline-Date.now())/1000),nextIn:Math.max(0,(g.nextAt-Date.now())/1000),
      result:g.result||null};
  }
  return{canDouble2,HAND,allTiles,active,newGame,addPlayer,removePlayer,legal,startRound,act,botMove,timeout,nextRound,backToLobby,view,defaultFamily,hsum,pname};
})();

/* ============ LAYOUT: cadena del dominó en serpiente ============ */
const Layout=(function(){
  const FLIP={R:'L',L:'R',D:'U',U:'D'};
  // Brazo derecho en coordenadas locales (unidad = 1 media ficha). Avanza hacia la derecha; al llegar a HW gira
  // hacia abajo con una ficha vertical y vuelve en sentido contrario, y así sucesivamente.
  function arm(tiles,HW,startX){
    const out=[];let x=startX,y=0,s=1,mode='H';
    tiles.forEach(t=>{
      if(mode==='H'){
        let len=2,perp=false;
        if(t.dbl){const e1=x+s;if(s>0?e1<HW:e1>-HW){len=1;perp=true;}}  // dobles cruzadas, salvo en el giro
        const e=x+s*len,x0=Math.min(x,e);
        out.push(perp?{x:x0,y:y-1,w:1,h:2,dir:s>0?'R':'L',perp:true,t}:{x:x0,y:y-0.5,w:2,h:1,dir:s>0?'R':'L',perp:false,t});
        x=e;if(s>0?x>=HW:x<=-HW)mode='V';
      }else{
        const lx=x-s*0.5;
        out.push({x:lx-0.5,y:y+0.5,w:1,h:2,dir:'D',perp:false,t});
        y+=2;x=lx-s*0.5;s=-s;mode='H';
      }
    });
    return out;
  }
  function halves(p){
    const flip=p.dir==='L'||p.dir==='U';
    const a={v:p.t.inner,end:false},b={v:p.t.outer,end:!!p.t.end};
    return flip?[b,a]:[a,b];
  }
  function layout(board,leftCount,HW){
    if(!board.length)return{items:[],minX:0,minY:0,w:1,h:1};
    const c=leftCount,ct=board[c],cd=ct[0]===ct[1];
    const right=[],left=[];
    for(let i=c+1;i<board.length;i++)right.push({inner:board[i][0],outer:board[i][1],dbl:board[i][0]===board[i][1],idx:i});
    for(let i=c-1;i>=0;i--)left.push({inner:board[i][1],outer:board[i][0],dbl:board[i][0]===board[i][1],idx:i});
    if(right.length)right[right.length-1].end=true;
    if(left.length)left[left.length-1].end=true;
    const half=cd?0.5:1;
    const items=[{x:-half,y:cd?-1:-0.5,w:cd?1:2,h:cd?2:1,vert:cd,idx:c,
      halves:[{v:ct[0],end:cd?(!left.length||!right.length):!left.length},{v:ct[1],end:cd?(!left.length||!right.length):!right.length}]}];
    arm(right,HW,half).forEach(p=>items.push({x:p.x,y:p.y,w:p.w,h:p.h,dir:p.dir,vert:p.perp||p.dir==='D'||p.dir==='U',idx:p.t.idx,halves:halves(p)}));
    arm(left,HW,half).forEach(p=>{
      const m=Object.assign({},p,{x:-p.x-p.w,y:-p.y-p.h,dir:FLIP[p.dir]});
      items.push({x:m.x,y:m.y,w:m.w,h:m.h,dir:m.dir,vert:m.perp||m.dir==='D'||m.dir==='U',idx:p.t.idx,halves:halves(m)});
    });
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    items.forEach(i=>{minX=Math.min(minX,i.x);minY=Math.min(minY,i.y);maxX=Math.max(maxX,i.x+i.w);maxY=Math.max(maxY,i.y+i.h);});
    return{items,minX,minY,w:maxX-minX,h:maxY-minY};
  }
  return{layout};
})();
if(typeof module!=='undefined')module.exports={Engine,Layout};
</script>

<script id="ui">
/* ============ MEMORIA (localStorage + JSON) ============ */
const KEY='famidomino.v1',ROOMKEY='famidomino.room';
function blankMem(){return{v:2,clientId:'c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36),name:'',family:null,settings:{maxLosses:3,turnSecs:30},stats:{byName:{},history:[]}};}
function loadMem(){try{const m=JSON.parse(localStorage.getItem(KEY));if(m){const r=Object.assign(blankMem(),m);
  if(!r.settings)r.settings={maxLosses:3,turnSecs:30};
  if(r.v<2){r.v=2;r.settings.turnSecs=30;}
  if(r.family&&!r.family.some(f=>f.photo))r.family=null;
  if(![15,30,45,60].includes(r.settings.turnSecs))r.settings.turnSecs=30;return r;}}catch(e){}return blankMem();}
let mem=loadMem();
function saveMem(){try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){toast('No hay espacio para guardar (fotos muy grandes)');}}
function saveRoom(){if(S.mode==='host'&&S.g){try{localStorage.setItem(ROOMKEY,JSON.stringify({code:S.code,ts:Date.now(),g:S.g}));}catch(e){}}}
function savedRoom(){try{const r=JSON.parse(localStorage.getItem(ROOMKEY));if(r&&Date.now()-r.ts<12*3600e3&&r.g&&r.g.phase!=='gameEnd')return r;}catch(e){}return null;}

/* ============ ESTADO ============ */
const S={mode:null,g:null,view:null,myPid:null,code:null,peer:null,conn:null,conns:{},modal:null,pick:null,revealKey:-1,joinCode:'',connected:false,retry:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600);}
const FAM_DEFAULT=Engine.defaultFamily().map((f,i)=>Object.assign(f,{photo:PHOTOS[i]||''}));
function FAMILY(){
  if(S.mode==='client')return(S.view&&S.view.family)||FAM_DEFAULT;
  if(S.g)return S.g.family;
  return mem.family||FAM_DEFAULT;
}
/* familia.json opcional junto al index.html: [{name,emoji,color,photo}, x7] */
fetch('familia.json').then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)&&j.length===7&&!mem.family){mem.family=j.map((f,i)=>Object.assign({},FAM_DEFAULT[i],f));saveMem();render();}}).catch(()=>{});

/* ============ HELPERS DE VISTA ============ */
function humans(){return S.g?S.g.players.filter(p=>!p.bot&&!p.out):[];}
function meId(){
  if(S.mode==='client')return S.myPid;
  if(S.mode==='host')return S.myPid;
  const g=S.g;if(!g)return null;
  const hs=humans();

/* ============ RENDER ============ */
function render(){
  const a=document.activeElement;
  if(a&&a.hasAttribute&&a.hasAttribute('data-keep')){S.dirty=true;return;}
  S.dirty=false;
  const app=document.getElementById('app');
  let html='';
  if(!S.mode)html=homeScreen();
  else{
    const V=curView();
    if(!V)html=`<div class="home"><h1>Conectando…</h1><p>Sala <b>${esc(S.code)}</b></p><button class="alt" onclick="leave()">Cancelar</button></div>`;
    else if(V.phase==='lobby')html=lobbyScreen(V);
    else html=gameScreen(V);
    if(V&&V.phase!=='lobby'&&V.phase!=='playing')html+=overlayEnd(V);
  }
  if(S.modal)html+=modalHTML();
  if(coverActive()){const t=S.g.players.find(p=>p.id===S.g.turn);html+=`<div class="cover" onclick="reveal()"><div class="big">📱</div>Pasa el móvil a<br><b style="font-size:2.2rem">${esc(t.name)}</b><br><small>Toca para ver tus fichas</small></div>`;}
  const oldB=document.getElementById('bw');const sc=oldB?[oldB.scrollLeft,oldB.scrollTop]:null;
  const mineNow=!!(S.mode&&curView()&&curView().phase==='playing'&&curView().turn===curView().me&&!coverActive());
  app.className=mineNow?'myturn':'';
  document.title=mineNow?'🟡 ¡Tu turno! · FamiDominó':'FamiDominó';
  if(mineNow&&!S.wasMine)turnAlert();
  S.wasMine=mineNow;
  app.innerHTML=html;
  drawBoard(sc);
  updateTimers();
}
/* ---- tablero: cadena en serpiente con zoom automático (más grande con pocas fichas) ---- */
function turnAlert(){
  try{if(navigator.vibrate)navigator.vibrate([150,80,150]);}catch(e){}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;S.ac=S.ac||new AC();const o=S.ac.createOscillator(),gn=S.ac.createGain();
    o.type='sine';o.frequency.value=880;gn.gain.value=.15;o.connect(gn);gn.connect(S.ac.destination);o.start();o.stop(S.ac.currentTime+.18);}catch(e){}
}
function drawBoard(sc){
  const bw=document.getElementById('bw');if(!bw)return;
  const V=curView();if(!V)return;
  const cw=bw.clientWidth,ch=bw.clientHeight;if(!cw||!ch)return;
  const padF=10,cellOf=hw=>{const l=Layout.layout(V.board,V.leftCount||0,hw);return Math.min((cw-padF*2)/l.w,(ch-padF*2)/l.h,76);};
  let bestHW=4,bestC=0;for(let hw=4;hw<=10;hw++){const c=cellOf(hw);if(c>bestC+0.01){bestC=c;bestHW=hw;}}
  if(V.board.length<=1||!S.hw)S.hw=bestHW;else if(cellOf(bestHW)>cellOf(S.hw)*1.12)S.hw=bestHW;
  const L=Layout.layout(V.board,V.leftCount||0,S.hw);
  if(V.board.length>=10||!V.board.length)S.zoom=null;
  if(!V.board.length){bw.innerHTML='';return;}
  const pad=10;
  const fit=Math.min((cw-pad*2)/L.w,(ch-pad*2)/L.h);
  const cell=Math.max(18,Math.min(S.zoom||fit,S.zoom?200:76));
  S.curCell=cell;
  const W=L.w*cell+pad*2,H=L.h*cell+pad*2;
  const fs=Math.round(cell*0.94);
  let h=`<div class="boardin" style="width:${W}px;height:${H}px;--f:${fs}px">`;
  L.items.forEach(it=>{
    h+=`<div class="btile ${it.vert?'vert':''}" style="left:${pad+(it.x-L.minX)*cell+1}px;top:${pad+(it.y-L.minY)*cell+1}px;width:${it.w*cell-2}px;height:${it.h*cell-2}px">`+
       it.halves.map(x=>`<div class="bh ${x.end?'end':''}">${face(x.v,fs)}</div>`).join('')+`</div>`;
  });
  bw.innerHTML=h+'</div>';
  if(sc){bw.scrollLeft=sc[0];bw.scrollTop=sc[1];}
}
function zoomBy(k){S.zoom=Math.max(18,Math.min(200,(S.zoom||S.curCell||40)*k));drawBoard();}

/* ============ ESTADÍSTICAS ============ */
function afterAction(){
  const g=S.g;if(!g)return;
  if(g.result&&!g.result.counted){
    g.result.counted=true;
    Object.keys(g.result.sums).forEach(id=>{
      const p=g.players.find(p=>p.id==id);if(!p||p.bot)return;
      const s=mem.stats.byName[p.name]||(mem.stats.byName[p.name]={games:0,wins:0,roundsWon:0,roundsLost:0});
      if(+id===g.result.winner)s.roundsWon++;if(+id===g.result.loser)s.roundsLost++;
    });saveMem();
  }
  if(g.phase==='gameEnd'&&!g.statsDone){
    g.statsDone=true;
    g.players.forEach(p=>{if(p.bot)return;const s=mem.stats.byName[p.name]||(mem.stats.byName[p.name]={games:0,wins:0,roundsWon:0,roundsLost:0});s.games++;if(p.id===g.champion)s.wins++;});
    mem.stats.history.push({date:new Date().toLocaleDateString('es-ES'),champion:Engine.pname(g,g.champion),players:g.players.map(p=>p.name),rounds:g.round});
    if(mem.stats.history.length>50)mem.stats.history.shift();
    saveMem();try{localStorage.removeItem(ROOMKEY);}catch(e){}
  }
}

/* ============ ACCIONES DE JUEGO ============ */
function tapTile(i){
  const V=curView();if(!V||V.phase!=='playing'||V.turn!==V.me||coverActive())return;
  const mv=Engine.legal(V.board,V.hand,V.forced).filter(m=>m.i===i);
  if(!mv.length)return toast('Esa ficha no encaja');
  const d=Engine.canDouble2(V.settings,V.board,V.hand);
  if(mv.length===1&&!(d&&(i===d.il||i===d.ir)))return send('play',i,mv[0].side);
  S.pick=i;render();
}
function doAct(a){send(a,0,'R');}
function send(a,i,side){
  S.pick=null;
  if(S.mode==='client'){if(S.conn&&S.conn.open)S.conn.send({t:'act',a,i,side});else toast('Sin conexión con el anfitrión');return;}
  const r=Engine.act(S.g,meId(),a,i,side,true);
  if(r.err)toast(r.err);
  afterAction();pushState();
}
function startGame(){S.zoom=null;
  if(S.g.players.length<2)return;
  S.g.players.forEach(p=>{p.losses=0;p.out=false;p.afk=0;});
  S.g.lastWinner=null;S.g.round=0;S.g.statsDone=false;
  Engine.startRound(S.g);pushState();
}
function nextNow(){Engine.nextRound(S.g);afterAction();pushState();}
function toLobby(){Engine.backToLobby(S.g);pushState();}
function setSet(k,v){S.g.settings[k]=v;mem.settings=Object.assign({},S.g.settings);saveMem();pushState();}
function addBot(){
  const names=['Bot Luna','Bot Rex','Bot Kiko','Bot Nube','Bot Rayo','Bot Toby','Bot Lola','Bot Max'];
  const used=S.g.players.map(p=>p.name);const n=names.find(x=>!used.includes(x))||'Bot';
  if(!Engine.addPlayer(S.g,n,{bot:true}))toast('Sala llena (8)');
  pushState();
}
function addLocal(){
  const el=document.getElementById('lp');const n=(el&&el.value.trim())||('Jugador '+(S.g.players.length+1));
  if(!Engine.addPlayer(S.g,n))toast('Sala llena (8)');
  S.dirty=false;pushState();
}
function rmPlayer(id){
  const p=S.g.players.find(p=>p.id===id);
  if(p&&p.clientId&&S.conns[p.clientId]){try{S.conns[p.clientId].send({t:'err',m:'El anfitrión te ha sacado de la sala'});S.conns[p.clientId].close();}catch(e){}delete S.conns[p.clientId];}
  Engine.removePlayer(S.g,id);pushState();
}
async function shareLink(){
  const link=location.origin+location.pathname+'?sala='+S.code;
  try{if(navigator.share){await navigator.share({title:'FamiDominó',text:'Entra a mi sala de dominó: '+S.code,url:link});return;}}catch(e){}
  try{await navigator.clipboard.writeText(link);toast('Enlace copiado');}catch(e){prompt('Copia el enlace:',link);}
}

/* ============ RED (PeerJS / WebRTC) ============ */
const PFX='famidomino-';
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function needName(){const el=document.getElementById('nm');if(el){mem.name=el.value.trim();saveMem();}if(!mem.name){toast('Escribe tu nombre');return false;}return true;}
function needPeer(){if(typeof Peer==='undefined'){toast('No se pudo cargar PeerJS (sin internet). Usa el modo local.');return false;}return true;}
function createRoom(){
  if(!needName()||!needPeer())return;
  const g=Engine.newGame(mem.settings,mem.family||FAM_DEFAULT);
  const me=Engine.addPlayer(g,mem.name,{clientId:mem.clientId});
  S.mode='host';S.g=g;S.myPid=me.id;S.code=genCode();hostPeer();render();
}
function resumeRoom(){
  if(!needPeer())return;const r=savedRoom();if(!r)return;
  S.g=r.g;S.code=r.code;S.mode='host';
  const me=S.g.players.find(p=>p.clientId===mem.clientId);S.myPid=me?me.id:S.g.players.find(p=>!p.bot).id;
  S.g.players.forEach(p=>{if(!p.bot&&p.clientId!==mem.clientId)p.connected=false;});
  S.g.deadline=Date.now()+S.g.settings.turnSecs*1000;
  hostPeer();render();
}
function hostPeer(){
  S.peerReady=false;
  const peer=new Peer(PFX+S.code);S.peer=peer;
  peer.on('open',()=>{S.peerReady=true;S.retry=0;render();});
  peer.on('connection',conn=>{
    conn.on('data',m=>hostMsg(conn,m));
    conn.on('close',()=>hostClosed(conn));conn.on('error',()=>hostClosed(conn));
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&S.retry<10){S.retry++;try{peer.destroy();}catch(x){}setTimeout(()=>{if(S.mode==='host')hostPeer();},3000);toast('Reservando la sala…');}
    else if(e.type!=='peer-unavailable')toast('Red: '+e.type);
  });
}
function hostMsg(conn,m){
  const g=S.g;if(!g||!m)return;
  if(m.t==='join'){
    let p=g.players.find(p=>p.clientId===m.clientId);
    if(!p){
      if(g.phase!=='lobby'){conn.send({t:'err',m:'La partida ya ha empezado'});return;}
      p=Engine.addPlayer(g,String(m.name||'Jugador').slice(0,14),{clientId:m.clientId});
      if(!p){conn.send({t:'err',m:'Sala llena (8 jugadores)'});return;}
    }
    p.connected=true;p.afk=0;conn._pid=p.id;conn.famV=0;S.conns[m.clientId]=conn;
    pushState();
  }else if(m.t==='act'&&conn._pid!=null){
    const r=Engine.act(g,conn._pid,m.a,m.i,m.side,true);
    if(r.err)try{conn.send({t:'err',m:r.err});}catch(e){}
    afterAction();pushState();
  }
}
function hostClosed(conn){
  const g=S.g;if(!g||conn._pid==null)return;
  const p=g.players.find(p=>p.id===conn._pid);
  if(p&&S.conns[p.clientId]===conn){p.connected=false;delete S.conns[p.clientId];pushState();}
}
function pushState(){
  const g=S.g;if(!g)return;
  if(S.mode==='host'){
    saveRoom();
    g.players.forEach(p=>{
      const c=p.clientId&&S.conns[p.clientId];
      if(c&&c.open){const v=Engine.view(g,p.id);if(c.famV!==g.famV){v.family=g.family;c.famV=g.famV;}try{c.send({t:'state',v});}catch(e){}}
    });
  }
  render();
}
function joinRoom(){
  const el=document.getElementById('jc');if(el)S.joinCode=el.value.toUpperCase();
  if(!needName()||!needPeer())return;
  const code=(S.joinCode||'').trim().toUpperCase();if(code.length<4)return toast('Escribe el código de la sala');
  S.mode='client';S.code=code;S.view=null;S.myPid=null;S.joined=false;render();
  clientConnect();
}
function clientConnect(){
  if(S.mode!=='client')return;
  try{if(S.peer)S.peer.destroy();}catch(e){}
  const peer=new Peer();S.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(PFX+S.code,{reliable:true});S.conn=conn;
    conn.on('open',()=>{S.connected=true;conn.send({t:'join',clientId:mem.clientId,name:mem.name});});
    conn.on('data',m=>{
      if(m.t==='state'){
        const fam=m.v.family||(S.view&&S.view.family);
        S.joined=true;
        const wasMine=S.view&&S.view.turn===S.view.me&&S.view.phase==='playing';
        S.view=m.v;S.view.family=fam;S.view._recv=Date.now();S.myPid=m.v.me;
        render();
      }else if(m.t==='err'){toast(m.m);if(!S.joined)leave();}
    });
    conn.on('close',()=>{S.connected=false;if(S.mode==='client'){toast('Conexión perdida: reintentando…');setTimeout(clientConnect,2500);}});
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){if(S.joined){setTimeout(clientConnect,3000);}else{toast('No existe la sala '+S.code);leave();}}
    else if(S.mode==='client'){setTimeout(clientConnect,3500);}
  });
}
function startLocal(){
  if(!needName())return;
  const g=Engine.newGame(mem.settings,mem.family||FAM_DEFAULT);
  Engine.addPlayer(g,mem.name);
  S.mode='local';S.g=g;S.code='LOCAL';S.myPid=0;render();
}
function leave(){
  try{if(S.peer)S.peer.destroy();}catch(e){}
  Object.assign(S,{mode:null,g:null,view:null,myPid:null,code:null,peer:null,conn:null,conns:{},modal:null,pick:null,joined:false});
  render();
}

/* ============ RELOJ: turnos, bots, auto-ronda ============ */
function tick(){
  const g=S.g;
  if(g&&(S.mode==='host'||S.mode==='local')){
    const now=Date.now();let changed=false;
    if(g.phase==='playing'&&!coverActive()){
      const p=g.players.find(p=>p.id===g.turn);
      if(p&&p.bot&&now>=g.botAt){Engine.botMove(g,p.id);changed=true;}
      else if(p&&g.settings.turnSecs>0&&now>=g.deadline){Engine.timeout(g);changed=true;}
    }else if(g.phase==='roundEnd'&&now>=g.nextAt){Engine.nextRound(g);changed=true;}
    if(changed){afterAction();pushState();}
  }
  updateTimers();
}
function updateTimers(){
  const V=curView();if(!V)return;
  const el=Date.now()-(V._recv||Date.now());
  const left=Math.max(0,V.timeLeft-el/1000),secs=V.settings.turnSecs;
  const t=document.getElementById('tnum'),f=document.getElementById('tfill');
  if(t)t.textContent=V.phase==='playing'?(secs>0?Math.ceil(left)+' s':'∞'):'';
  if(f)f.style.width=secs>0?Math.min(100,left/secs*100)+'%':'100%';
  const urgent=V.phase==='playing'&&left<=10;
  if(t)t.classList.toggle('urgent',urgent);if(f)f.classList.toggle('urgent',urgent);
  const n=document.getElementById('nxt');if(n)n.textContent=Math.max(0,Math.ceil(V.nextIn-el/1000));
}
setInterval(tick,300);
(function init(){
  const q=new URLSearchParams(location.search).get('sala');if(q)S.joinCode=q.toUpperCase().slice(0,5);
  render();
})();
</script>
